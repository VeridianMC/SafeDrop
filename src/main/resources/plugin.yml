name: SafeDrop
version: '${version}'
main: dev.codedred.safedrop.SafeDrop
api-version: '1.21'
authors: [ CodedRed, VeridianMC ]
description: Protect valuable items from accidental drops.
website: https://github.com/VeridianMC/SafeDrop

commands:
  safedrop:
    aliases: [ sd ]
    description: Manage your SafeDrop protection.
    usage: "/safedrop [on|off|status|help|reload]"

permissions:
  safedrop.use:
    description: Use SafeDrop and its player commands.
    default: true
  safedrop.admin:
    description: Reload SafeDrop.
    default: op
  sd.use:
    description: Legacy alias for safedrop.use.
    default: false
    children:
      safedrop.use: true
  sd.admin:
    description: Legacy alias for safedrop.admin.
    default: false
    children:
      safedrop.admin: true
