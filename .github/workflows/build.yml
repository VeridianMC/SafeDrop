name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build SafeDrop
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SafeDrop
          path: build/libs/SafeDrop-*.jar
          if-no-files-found: error
